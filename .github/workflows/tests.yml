# Runs the test suite automatically on every push and every pull request.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check the app starts (imports without errors)
        run: python -c "from backend.main import app; print('App loaded:', app.title)"

      - name: Run tests
        run: pytest -v
